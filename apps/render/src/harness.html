<!doctype html>
<!--
  The render harness page — a TEMPLATE. `scripts/bundleHarness.ts` replaces the
  marker below with the esbuild IIFE of `src/harness.ts` and writes the result
  to `dist/harness.html`; nothing here is ever served over HTTP, it is opened
  over `file://` by the pooled chromium pages.

  No external references of any kind, by necessity: `file://` blocks module
  scripts and cross-origin fetches, and a render service must not have a second
  way to fail before it draws anything.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VETA render harness</title>
    <style>
      /* The canvas IS the image: no margins, no scrollbars, no background of
         our own (a transparent render must read as transparent when the node
         side falls back to a clipped screenshot). */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script>/*VETA_HARNESS_BUNDLE*/</script>
  </body>
</html>
