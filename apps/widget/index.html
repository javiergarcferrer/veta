<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + the safe-area padding below: this page is often a
         full-screen iframe on a phone, where the home indicator would otherwise
         sit on top of the estimate deck. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The configurator is a tool, never a landing page: it must never be
         indexed on its own, and its address may carry a visitor's build. -->
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Configurator</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { padding-bottom: env(safe-area-inset-bottom); }
      /* The frame reports its own height (see the SDK's snippet), so the page
         must never scroll internally — it is exactly as tall as its content. */
      #veta-widget { min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="veta-widget"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
